<!DOCTYPE html>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <!-- Bounce Stripe / email / WhatsApp returns into the native app on phones. -->
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || "";
        if (!/iPhone|iPad|iPod|Android/i.test(ua)) return;
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        var params = new URLSearchParams(location.search);
        var hostAndPath = null;
        if (path === "/whatsapp/callback") hostAndPath = "whatsapp/callback";
        else if (path === "/auth/confirm-delete") hostAndPath = "auth/confirm-delete";
        else if (
          path === "/profile" &&
          (params.get("checkout") === "success" ||
            params.get("checkout") === "cancel")
        ) {
          hostAndPath = "profile";
        }
        if (!hostAndPath) return;
        window.location.href =
          "cheery://" + hostAndPath + location.search + location.hash;
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Birthday and customer relationship messaging for small businesses.">

    posthog.init("YOUR_POSTHOG_API_KEY", {
      api_host: "https://us.i.posthog.com",
      // Keep config minimal — "defaults" + cookieless/consent can drop custom
      // capture while still allowing Web Vitals through.
      autocapture: false,
      capture_pageview: false,
      capture_pageleave: false,
      capture_performance: false,
      persistence: "localStorage+cookie",
      person_profiles: "identified_only",
      respect_dnt: false,
      opt_out_capturing_by_default: false,
      loaded: function(ph) {
        try {
          // Clear any prior opt-out from earlier sessions / project settings.
          if (typeof ph.opt_in_capturing === "function") {
            ph.opt_in_capturing();
